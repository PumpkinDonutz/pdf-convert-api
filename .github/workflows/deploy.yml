name: ci-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_RESOURCE_GROUP: pdf-convert-rg
  AZURE_CONTAINER_APP: pdf-convert-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test -t pdf-convert-api:test .
      - name: Run tests inside the image
        run: docker run --rm pdf-convert-api:test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
      id-token: write # OIDC login to Azure (no stored Azure password)
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pdf-convert-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable tag = git SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new revision
        run: |
          az extension add --name containerapp --upgrade --only-show-errors -y
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --output none

      - name: Smoke check /healthz (allow for cold start)
        run: |
          fqdn=$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          for i in $(seq 1 20); do
            if curl --silent --fail --max-time 30 "https://$fqdn/healthz" > /dev/null; then
              echo "healthz OK"; exit 0
            fi
            sleep 10
          done
          echo "healthz did not become ready" >&2; exit 1
